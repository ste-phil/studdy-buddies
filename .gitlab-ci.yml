stages:
  - build
  - publish

variables:
  DOTNET_VERSION: "10.0"
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"

# Compile the .NET solution. Quick sanity check before we build the image.
build:dotnet:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
    - dotnet restore StudyBuddies.slnx
    - dotnet build StudyBuddies.slnx -c Release --no-restore
  cache:
    key:
      files:
        - StudyBuddies.slnx
        - StudyBuddies.Core/StudyBuddies.Core.csproj
        - StudyBuddies.Web/StudyBuddies.Web.csproj
    paths:
      - .nuget/

# Build the Docker image and push to the GitLab Container Registry.
# Uses docker-in-docker. If your runner doesn't allow privileged mode,
# swap this for a Kaniko-based job (see GitLab docs).
publish:image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      --pull
      --tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      --tag "$IMAGE_NAME:latest"
      .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_NAME:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
